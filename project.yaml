last_updated: 2026-08-23
limitations: The public package contains code and documentation, not exchange observations or generated run bundles. Synthetic results are software evidence only. The full-archive trade study terminated at a predeclared data-quality gate, so it published no prediction, execution, profit, capacity, or significance claim. The separate website and Space summary is one four-hour, nonconfirmatory deterministic market-order simulation. Its 144 counterfactual scenarios overlap and cannot be summed; adjacent pseudo-heldout phases are not prospectively untouched or cross-day replication. Drawdown is marked net equity from zero capital normalized by turnover, not account return. No live-trading, profitability, capacity, or significance claim is authorized.
